<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up Loan</title>
    <link rel="stylesheet" href="../assets/css-style/signup.css" />
  </head>
  <body>
    <section>
      <div class="signup-box">
        <form action="">
          <h2>Signup</h2>

          <div class="input-box">
            <span class="icon"></span>
            <input type="student_id" required />
            <label>Student ID</label>
          </div>

          <div class="input-box">
            <span class="icon"></span>
            <input type="name" required />
            <label>Name</label>
          </div>

          <div class="input-box">
            <span class="icon"><ion-icon name="mail-open"></ion-icon></span>
            <input type="email" required />
            <label>Email</label>
          </div>

          <div class="input-box">
            <span class="icon"><ion-icon name="document-lock"></ion-icon></span>
            <input type="password" required />
            <label>Password</label>
          </div>

          <div class="input-box">
            <span class="icon"></span>
            <input type="confirm_password" required />
            <label>Confirm Password</label>
          </div>

          <div>
            <button>Signup</button>
          </div>
        </form>
      </div>
    </section>

    <script
      type="module"
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"
    ></script>
  </body>
</html>
