<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Select Tag</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-900 text-white p-4">
    <div class="flex flex-col space-y-2 w-48">
      <button
        onclick="selectTag('#Scholarship')"
        class="bg-gray-700 hover:bg-amber-500 px-4 py-2 rounded-md"
      >
        #Scholarship
      </button>
      <button
        onclick="selectTag('#Emergency')"
        class="bg-gray-700 hover:bg-amber-500 px-4 py-2 rounded-md"
      >
        #Emergency
      </button>
      <button
        onclick="selectTag('#Loan')"
        class="bg-gray-700 hover:bg-amber-500 px-4 py-2 rounded-md"
      >
        #Loan
      </button>
      <button
        onclick="selectTag('#AcademicHelp')"
        class="bg-gray-700 hover:bg-amber-500 px-4 py-2 rounded-md"
      >
        #AcademicHelp
      </button>
    </div>

    <script>
      function selectTag(tag) {
        if (window.opener && !window.opener.closed) {
          window.opener.receiveTag(tag); // send tag back
          window.close();
        }
      }
    </script>
  </body>
</html>
