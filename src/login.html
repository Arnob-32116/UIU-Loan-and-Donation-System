<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0" />
    <title>Log-In & Reg</title>
    <link rel="stylesheet" href="../assets/css-style/login.css" />
  </head>

  <body>
    <section>
      <div class="login-box">
        <form action="../assets/scripts/login.php" method="post">
          <h2>Login</h2>
          <div class="input-box">
            <span class="icon"><ion-icon name="mail-open"></ion-icon></span>
            <input type="email" name="emails" required />
            <label>Email</label>
          </div>

          <div class="input-box">
            <span class="icon"><ion-icon name="document-lock"></ion-icon></span>
            <input type="Password" name="passwords" required />
            <label>Password</label>
          </div>

          <div class="remember-forgot">
            <label> <input type="checkbox" /> Remember me </label>
            <a href="#">Forgot Password?</a>
          </div>

          <div>
            <button type="submit">Login</button>
          </div>

          <div class="register-link">
            <p>
              Donn't have an account? <a href="../src/signup.html">Register</a>
            </p>
          </div>
        </form>
      </div>
    </section>

    <script
      type="module"
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"
    ></script>
  </body>
</html>
